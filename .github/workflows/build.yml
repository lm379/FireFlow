name: Build binary and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Create release first
  create-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.create-release.outputs.id }}
      upload-url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-upload:
    needs: create-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          # Android builds with NDK
          - goos: android
            goarch: arm64
            cgo_enabled: 1
            cc: aarch64-linux-android24-clang
          - goos: android
            goarch: arm
            goarm: 7
            cgo_enabled: 1
            cc: armv7a-linux-androideabi24-clang
          - goos: android
            goarch: amd64
            cgo_enabled: 1
            cc: x86_64-linux-android24-clang

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get current date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Android NDK
        if: matrix.goos == 'android'
        run: |
          echo "📦 Installing Android NDK..."
          
          # Install Android SDK command-line tools
          sudo apt-get update
          sudo apt-get install -y wget unzip
          
          # Download and install Android NDK
          NDK_VERSION="r26d"
          NDK_URL="https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          
          wget -q "${NDK_URL}" -O ndk.zip
          unzip -q ndk.zip
          
          export ANDROID_NDK_HOME="${PWD}/android-ndk-${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}" >> $GITHUB_ENV
          echo "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          
          echo "✅ Android NDK installed at ${ANDROID_NDK_HOME}"

      - name: Get dependencies
        run: go mod download

      - name: Download latest frontend release
        run: |
          echo "🔍 Getting latest frontend release..."
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/lm379/fireflow-frontend/releases/latest | jq -r '.tag_name')
          echo "📦 Latest release: $LATEST_RELEASE"
          
          echo "⬇️ Downloading frontend dist..."
          curl -L -o dist.zip "https://github.com/lm379/fireflow-frontend/releases/download/$LATEST_RELEASE/dist.zip"
          
          echo "📂 Extracting to cmd/server/web..."
          mkdir -p cmd/server/web
          unzip -o dist.zip -d cmd/server/web
          rm dist.zip
          
          echo "✅ Frontend files extracted:"
          ls -la cmd/server/web/

      - name: Build binary
        env:
          CGO_ENABLED: ${{ matrix.cgo_enabled || '0' }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CC: ${{ matrix.cc }}
        run: |
          # Determine file extension
          ext=""
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            ext=".exe"
          fi
          
          # Build output filename
          output="fireflow-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          archive="fireflow-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          
          # Set up Android NDK compiler path if building for Android
          if [[ "${{ matrix.goos }}" == "android" ]]; then
            export CC="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.cc }}"
            echo "Using Android NDK compiler: ${CC}"
          fi
          
          # Build the binary with optimizations
          echo "Building ${output} for ${{ matrix.goos }}/${{ matrix.goarch }}..."
          go build \
            -ldflags="-s -w -X main.version=${GITHUB_REF#refs/tags/} -X main.buildTime=$(date -u '+%Y-%m-%d_%H:%M:%S_UTC') -X main.goVersion=$(go version | cut -d' ' -f3)" \
            -trimpath \
            -o "${output}" \
            ./cmd/server
          
          # Verify the binary was created
          if [[ ! -f "${output}" ]]; then
            echo "Error: Binary ${output} was not created"
            exit 1
          fi
          
          # Create tarball
          tar -czf "${archive}" "${output}"
          
          echo "✅ Built: ${output} ($(du -h "${output}" | cut -f1))"
          echo "✅ Archive: ${archive} ($(du -h "${archive}" | cut -f1))"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: fireflow-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}